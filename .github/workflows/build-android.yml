name: Build Android APK

on:
  push:
    branches: [ "main", "Front-Dev", "Testing", "agent-redesign", "develop" ]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [ "main", "agent-redesign" ]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK (universal)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
