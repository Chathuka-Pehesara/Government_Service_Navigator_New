name: Build Windows App

on:
  push:
    branches: [ "main", "Front-Dev", "Testing" ]
    # Pushing a tag like v1.0.1 also publishes a GitHub Release that
    # install/install.ps1 downloads from. Path filters are ignored for tags.
    tags: [ "v*" ]
    paths:
      - "web/**"
      - ".github/workflows/windows-software-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "web/**"
      - ".github/workflows/windows-software-build.yml"
  workflow_dispatch:

concurrency:
  group: windows-software-build.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer (NSIS + portable)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version

      # tsc -b && vite build -> web/dist, which Electron serves via electron/main.cjs.
      - name: Build web app
        run: npm run build

      - name: Package desktop app
        run: npx electron-builder --win --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-${{ github.run_number }}
          path: |
            web/release/*.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hand-written description in .github/release-notes/<tag>.md goes above the generated notes
          NOTES=../.github/release-notes/${{ github.ref_name }}.md
          if [ -f "$NOTES" ]; then
            gh release create "${{ github.ref_name }}" release/*.exe \
              --title "Government Service Navigator ${{ github.ref_name }}" \
              --notes-file "$NOTES" --generate-notes
          else
            gh release create "${{ github.ref_name }}" release/*.exe \
              --title "Government Service Navigator ${{ github.ref_name }}" \
              --generate-notes
          fi
