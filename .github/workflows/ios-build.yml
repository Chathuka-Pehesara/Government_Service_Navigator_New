name: Build iOS

on:
  push:
    branches: [ "main", "Front-Dev", "Testing" ]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Citizen builds talk to the hosted backend, never localhost.
  API_URL: https://gsn-api-dpa2agb6c5h7gyar.southeastasia-01.azurewebsites.net

jobs:
  build:
    name: Build LankaServe iOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Precache iOS artifacts
        run: flutter precache --ios

      # Release build for real iPhones. It is unsigned, so it must be signed
      # (Apple Developer account, Sideloadly, AltStore, etc.) before installing.
      # flutter build runs pod install itself when a Podfile is needed.
      - name: Build iOS App (device, release)
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL=${{ env.API_URL }}

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qr LankaServe-unsigned.ipa Payload

      # Flutter only supports Debug builds on the simulator.
      - name: Build iOS App (simulator)
        run: |
          flutter build ios --simulator --debug \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL=${{ env.API_URL }}

      - name: Zip the Simulator App
        working-directory: mobile/build/ios/iphonesimulator
        run: zip -qr LankaServe-simulator.zip Runner.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: mobile/build/ipa/LankaServe-unsigned.ipa
          retention-days: 14

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app-${{ github.run_number }}
          path: mobile/build/ios/iphonesimulator/LankaServe-simulator.zip
          retention-days: 14
