name: Build iOS

on:
  push:
    branches: [ "main", "Front-Dev", "Testing" ]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Precache iOS artifacts
        run: flutter precache --ios

      # No Podfile is committed; --config-only generates ios/Podfile and
      # Generated.xcconfig so the workspace can be built with xcodebuild.
      - name: Configure iOS project
        run: flutter build ios --config-only --simulator --debug

      - name: Install CocoaPods
        run: cd ios && pod install

      # Flutter only supports Debug builds on the simulator (Release is AOT for devices).
      - name: Build iOS App
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ${{ github.workspace }}/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the App
        working-directory: ${{ github.workspace }}/derivedData/Build/Products/Debug-iphonesimulator
        run: zip -qr Runner.zip Runner.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app-${{ github.run_number }}
          path: derivedData/Build/Products/Debug-iphonesimulator/Runner.zip
          retention-days: 14
